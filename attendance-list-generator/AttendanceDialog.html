<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "맑은 고딕", "Malgun Gothic", sans-serif;
      padding: 18px;
      font-size: 13px;
      background: #F8FAFC;
      color: #1E293B;
    }

    /* 대상 탭 */
    #metaCard {
      background: #EEF2FF;
      border: 1px solid #C7D2FE;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    #metaCard .label { font-size: 12px; color: #4338CA; font-weight: 600; }
    #sheetNameRow {
      display: flex; align-items: center; gap: 8px;
      font-size: 19px; font-weight: 800; color: #312E81; margin-top: 2px;
    }
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 3px solid #C7D2FE;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: att-spin 0.7s linear infinite;
    }
    #sheetNameRow.loading .spinner { display: inline-block; }
    #sheetNameRow.loading #sheetName { color: #6366F1; font-weight: 600; font-size: 14px; }
    @keyframes att-spin {
      to { transform: rotate(360deg); }
    }

    /* 플랫폼 선택 (세그먼트 버튼) */
    #platformRow { margin-bottom: 16px; }
    #platformRow .sectionLabel { font-size: 12px; color: #64748B; font-weight: 600; margin-bottom: 6px; }
    .segment {
      display: inline-flex;
      background: #E2E8F0;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }
    .segment button {
      border: none;
      background: transparent;
      padding: 8px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #64748B;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .segment button.active {
      background: #4F46E5;
      color: #fff;
      box-shadow: 0 2px 6px rgba(79,70,229,0.35);
    }
    .segment button:not(.active):hover { background: #CBD5E1; }

    /* 반 목록 */
    .sectionLabel { font-size: 12px; color: #64748B; font-weight: 600; margin-bottom: 6px; }
    #colHeader {
      display: flex;
      padding: 6px 10px;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      font-size: 11.5px; font-weight: 700; color: #475569;
    }
    #colHeader .h1 { flex: 0 0 34%; }
    #colHeader .h2 { flex: 1; }

    #rowsWrap {
      max-height: 340px;
      overflow-y: auto;
      border: 1px solid #E2E8F0;
      border-top: none;
      border-radius: 0 0 10px 10px;
      margin-bottom: 8px;
      background: #F8FAFC;
      padding: 8px;
    }

    .groupBox {
      display: flex;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
    }
    .classCol { flex: 0 0 34%; border-right: 1px solid #F1F5F9; }
    .classRow { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
    .fieldsCol {
      flex: 1;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px;
    }

    input[type="text"] {
      box-sizing: border-box;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.5px;
      background: #F8FAFC;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #4F46E5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }
    .classRow input.cls { flex: 1; width: auto; }
    .fieldsCol input { flex: 1; width: auto; min-width: 80px; }

    .delBtn {
      flex: 0 0 auto;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: none;
      background: #FEE2E2;
      color: #DC2626;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .delBtn:hover { background: #FCA5A5; color: #7F1D1D; }

    .innerConnector { display: flex; justify-content: center; }
    .splitBtn {
      border: none; background: none;
      color: #94A3B8; font-size: 10.5px;
      padding: 1px 8px; cursor: pointer;
    }
    .splitBtn:hover { color: #DC2626; text-decoration: underline; }

    .outerConnector { display: flex; justify-content: center; margin: 3px 0; }
    .mergeBtn {
      border: 1px dashed #A5B4FC; background: #EEF2FF; color: #4338CA;
      font-size: 11px; font-weight: 600; padding: 3px 14px; border-radius: 999px; cursor: pointer;
    }
    .mergeBtn:hover { background: #E0E7FF; }

    .btnrow { display: flex; align-items: center; gap: 10px; margin: 10px 0 16px; }
    #addRowBtn {
      border: 1.5px dashed #94A3B8;
      background: #fff;
      color: #475569;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #addRowBtn:hover:not(:disabled) { border-color: #4F46E5; color: #4F46E5; background: #EEF2FF; }
    #addRowBtn:disabled { cursor: default; opacity: 0.4; }
    #rowCountInfo { color: #94A3B8; font-size: 12px; }

    /* 실행 버튼 */
    #runBtn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #4F46E5, #4338CA);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(79,70,229,0.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    #runBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(79,70,229,0.4); }
    #runBtn:active:not(:disabled) { transform: translateY(0); }
    #runBtn:disabled { cursor: default; opacity: 0.6; box-shadow: none; }

    /* 진행 게이지바 */
    #progressWrap { display: none; margin-top: 12px; }
    #progressTrack {
      width: 100%; height: 8px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }
    #progressBar {
      width: 40%; height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #818CF8, #4F46E5, #818CF8);
      background-size: 200% 100%;
      animation: att-slide 1.1s ease-in-out infinite, att-shimmer 1.4s linear infinite;
    }
    @keyframes att-slide {
      0% { margin-left: -40%; }
      50% { margin-left: 70%; }
      100% { margin-left: -40%; }
    }
    @keyframes att-shimmer {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }
    #progressLabel { font-size: 12px; color: #64748B; margin-top: 6px; }

    #status { margin-top: 14px; white-space: pre-line; color: #475569; line-height: 1.6; }
    #status a { color: #4F46E5; }
  </style>
</head>
<body>
  <div id="metaCard">
    <div class="label">대상 탭</div>
    <div id="sheetNameRow" class="loading">
      <span class="spinner"></span>
      <span id="sheetName">시트 인식 중...</span>
    </div>
  </div>

  <div id="platformRow">
    <div class="sectionLabel">출력 플랫폼</div>
    <div class="segment" id="platformSegment">
      <button type="button" data-value="soongsoongi" class="active">슝슝이</button>
      <button type="button" data-value="picon">피콘</button>
    </div>
  </div>

  <div class="sectionLabel">반 목록 (반과 반 사이 "🔗 결합" 버튼으로 여러 반을 하나로 합칠 수 있음)</div>
  <div id="colHeader">
    <div class="h1">대상 반 이름 (카톡방 값)</div>
    <div class="h2">강좌명 / 입장코드 / 링크명 (합친 반은 한 줄만)</div>
  </div>
  <div id="rowsWrap">
    <div id="rowsBody"></div>
  </div>

  <datalist id="roomList"></datalist>

  <div class="btnrow">
    <button id="addRowBtn" type="button">+ 반 추가</button>
    <span id="rowCountInfo"></span>
  </div>

  <button id="runBtn">▶ 알림톡 대상자 추출</button>

  <div id="progressWrap">
    <div id="progressTrack"><div id="progressBar"></div></div>
    <div id="progressLabel">엑셀 생성 중...</div>
  </div>

  <div id="status"></div>

  <script>
    const DEFAULT_ROWS = 0;
    const rowsBody = document.getElementById('rowsBody');
    const addRowBtn = document.getElementById('addRowBtn');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const rowCountInfo = document.getElementById('rowCountInfo');
    const progressWrap = document.getElementById('progressWrap');

    let maxRows = 30;
    let selectedPlatform = 'soongsoongi';

    // 반(카톡방 이름) 하나가 rows의 원소 하나. mergedWithNext[i] === true면
    // rows[i]와 rows[i+1]이 같은 그룹으로 합쳐져 있다는 뜻 (연속된 것만 합칠 수 있음).
    let rows = [];
    let mergedWithNext = [];

    document.querySelectorAll('#platformSegment button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#platformSegment button').forEach(function (b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        selectedPlatform = btn.dataset.value;
      });
    });

    function computeGroups() {
      const groups = [];
      let i = 0;
      while (i < rows.length) {
        let j = i;
        while (j < rows.length - 1 && mergedWithNext[j]) j++;
        groups.push([i, j]);
        i = j + 1;
      }
      return groups;
    }

    function makeFieldInput(cssClass, placeholder, prop, rowIdx) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = cssClass;
      input.placeholder = placeholder;
      input.value = rows[rowIdx][prop];
      input.addEventListener('input', function () { rows[rowIdx][prop] = input.value; });
      return input;
    }

    function render() {
      rowsBody.innerHTML = '';
      const groups = computeGroups();

      groups.forEach(function (pair) {
        const start = pair[0], end = pair[1];

        const groupBox = document.createElement('div');
        groupBox.className = 'groupBox';
        groupBox.style.marginBottom = '3px';

        const classCol = document.createElement('div');
        classCol.className = 'classCol';

        for (let k = start; k <= end; k++) {
          (function (k) {
            const classRow = document.createElement('div');
            classRow.className = 'classRow';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'cls';
            input.setAttribute('list', 'roomList');
            input.placeholder = '예: A반';
            input.value = rows[k].className;
            input.addEventListener('input', function () { rows[k].className = input.value; });

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'delBtn';
            delBtn.title = '이 반 삭제';
            delBtn.textContent = '✕';
            delBtn.addEventListener('click', function () { deleteRow(k); });

            classRow.appendChild(input);
            classRow.appendChild(delBtn);
            classCol.appendChild(classRow);

            if (k < end) {
              const connector = document.createElement('div');
              connector.className = 'innerConnector';
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'splitBtn';
              btn.textContent = '✂ 분리';
              btn.title = '이 두 반을 다시 나누기';
              btn.addEventListener('click', function () { toggleMerge(k); });
              connector.appendChild(btn);
              classCol.appendChild(connector);
            }
          })(k);
        }

        const fieldsCol = document.createElement('div');
        fieldsCol.className = 'fieldsCol';
        fieldsCol.appendChild(makeFieldInput('course', '강좌명', 'courseName', start));
        fieldsCol.appendChild(makeFieldInput('code', '입장코드', 'entryCode', start));
        fieldsCol.appendChild(makeFieldInput('link', '링크명', 'linkName', start));

        groupBox.appendChild(classCol);
        groupBox.appendChild(fieldsCol);
        rowsBody.appendChild(groupBox);

        if (end < rows.length - 1) {
          (function (end) {
            const outer = document.createElement('div');
            outer.className = 'outerConnector';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mergeBtn';
            btn.textContent = '🔗 결합';
            btn.title = '위 반과 아래 반을 하나로 합치기';
            btn.addEventListener('click', function () { toggleMerge(end); });
            outer.appendChild(btn);
            rowsBody.appendChild(outer);
          })(end);
        }
      });

      updateRowCountInfo();
    }

    function toggleMerge(idx) {
      mergedWithNext[idx] = !mergedWithNext[idx];
      render();
    }

    function addRow() {
      if (rows.length >= maxRows) return;
      rows.push({ className: '', courseName: '', entryCode: '', linkName: '' });
      if (rows.length > 1) mergedWithNext.push(false);
      render();
    }

    function deleteRow(idx) {
      const n = rows.length;
      if (n <= 1) {
        rows = [];
        mergedWithNext = [];
      } else if (idx === 0) {
        mergedWithNext.splice(0, 1);
        rows.splice(idx, 1);
      } else if (idx === n - 1) {
        mergedWithNext.splice(mergedWithNext.length - 1, 1);
        rows.splice(idx, 1);
      } else {
        const stillMerged = mergedWithNext[idx - 1] && mergedWithNext[idx];
        mergedWithNext.splice(idx - 1, 2, stillMerged);
        rows.splice(idx, 1);
      }
      render();
    }

    function updateRowCountInfo() {
      rowCountInfo.textContent = rows.length + ' / ' + maxRows + '행';
      addRowBtn.disabled = rows.length >= maxRows;
    }

    addRowBtn.addEventListener('click', addRow);

    google.script.run
      .withSuccessHandler(function (init) {
        document.getElementById('sheetNameRow').classList.remove('loading');
        document.getElementById('sheetName').textContent = init.sheetName;
        maxRows = init.maxRows || 30;

        const roomList = document.getElementById('roomList');
        init.roomNames.forEach(function (name) {
          const opt = document.createElement('option');
          opt.value = name;
          roomList.appendChild(opt);
        });

        for (let i = 0; i < DEFAULT_ROWS; i++) addRow();
        render();
      })
      .withFailureHandler(function (err) {
        document.getElementById('sheetNameRow').classList.remove('loading');
        document.getElementById('sheetName').textContent = '인식 실패';
        statusEl.textContent = '오류: ' + err.message;
      })
      .ATT_getDialogInit();

    const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

    function downloadBase64File(base64, fileName, mimeType) {
      const byteChars = atob(base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const blob = new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function buildConfigs() {
      const configs = [];
      computeGroups().forEach(function (pair) {
        const start = pair[0], end = pair[1];
        const classNames = [];
        for (let k = start; k <= end; k++) {
          const v = rows[k].className.trim();
          if (v) classNames.push(v);
        }
        if (classNames.length === 0) return;
        const leader = rows[start];
        configs.push({
          classNames: classNames,
          courseName: leader.courseName,
          entryCode: leader.entryCode,
          linkName: leader.linkName,
        });
      });
      return configs;
    }

    runBtn.addEventListener('click', function () {
      const configs = buildConfigs();

      runBtn.disabled = true;
      statusEl.textContent = '';
      progressWrap.style.display = 'block';

      google.script.run
        .withSuccessHandler(function (result) {
          progressWrap.style.display = 'none';

          result.files.forEach(function (f, idx) {
            setTimeout(function () {
              downloadBase64File(f.base64, f.fileName, XLSX_MIME);
            }, idx * 400);
          });

          const lines = result.files.map(function (f) {
            return '- ' + f.className + ': ' + f.count + '명 (' + f.fileName + ')';
          });

          let html = result.files.length > 0
            ? '✔ 엑셀 ' + result.files.length + '개 다운로드 시작됨 (순차적으로 뜹니다)<br>' + lines.join('<br>')
            : '해당 반에 추출된 명단이 없어 엑셀을 생성하지 않았습니다.';

          if (result.skipped && result.skipped.length > 0) {
            const skipLines = result.skipped.map(function (s) {
              return '- ' + s.className + ': 명단 없음 (엑셀 생성 안 함)';
            });
            html += '<br><br><span style="color:#64748B; font-weight:700;">⏭ 명단이 없어 건너뜀 (' +
              result.skipped.length + '개 반):</span><br>' + skipLines.join('<br>');
          }

          if (result.excluded && result.excluded.length > 0) {
            const exLines = result.excluded.map(function (e) {
              return '- ' + e.name + ' (' + e.phone + ') — ' + e.room;
            });
            html += '<br><br><span style="color:#DC2626; font-weight:700;">⚠ 번호 형식이 맞지 않아 제외됨 (' +
              result.excluded.length + '명):</span><br>' + exLines.join('<br>');
          }

          statusEl.innerHTML = html;
          runBtn.disabled = false;
        })
        .withFailureHandler(function (err) {
          progressWrap.style.display = 'none';
          statusEl.textContent = '오류: ' + err.message;
          runBtn.disabled = false;
        })
        .ATT_generate(selectedPlatform, configs);
    });
  </script>
</body>
</html>
