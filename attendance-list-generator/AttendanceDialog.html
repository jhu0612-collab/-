<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: sans-serif; padding: 14px; font-size: 13px; }
    #meta { color: #666; margin-bottom: 10px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 4px; }
    th { background: #f0f4f8; font-size: 12px; }
    input[type="text"] { width: 100%; box-sizing: border-box; border: 1px solid #ccc; padding: 4px; font-size: 12px; }
    #rowsWrap { max-height: 340px; overflow-y: auto; border: 1px solid #eee; margin-bottom: 8px; }
    .btnrow { margin: 8px 0; }
    button { padding: 6px 14px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.5; }
    .delBtn { padding: 2px 8px; font-size: 11px; color: #C62828; background: #fff; border: 1px solid #C62828; border-radius: 3px; }
    #status { margin-top: 10px; white-space: pre-line; color: #555; }
    #status a { color: #4A6FA5; }
  </style>
</head>
<body>
  <div id="meta">대상 탭: <b id="sheetName">-</b></div>

  <div id="rowsWrap">
    <table>
      <thead>
        <tr>
          <th style="width:22%">대상 반 이름 (카톡방 값)</th>
          <th style="width:24%">강좌명</th>
          <th style="width:18%">입장코드</th>
          <th style="width:28%">링크명</th>
          <th style="width:8%"></th>
        </tr>
      </thead>
      <tbody id="rowsBody"></tbody>
    </table>
  </div>

  <datalist id="roomList"></datalist>

  <div class="btnrow">
    <button id="addRowBtn" type="button">+ 반 추가</button>
    <span id="rowCountInfo" style="color:#888; margin-left:8px;"></span>
  </div>

  <button id="runBtn">▶ 알림톡 대상자 추출</button>
  <div id="status"></div>

  <script>
    const DEFAULT_ROWS = 5;
    const rowsBody = document.getElementById('rowsBody');
    const addRowBtn = document.getElementById('addRowBtn');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const rowCountInfo = document.getElementById('rowCountInfo');

    let maxRows = 30;

    function addRow() {
      const rows = rowsBody.querySelectorAll('tr').length;
      if (rows >= maxRows) return;

      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input type="text" class="cls" list="roomList" placeholder="예: A반"></td>' +
        '<td><input type="text" class="course" placeholder="강좌명"></td>' +
        '<td><input type="text" class="code" placeholder="입장코드"></td>' +
        '<td><input type="text" class="link" placeholder="링크명"></td>' +
        '<td style="text-align:center"><button type="button" class="delBtn">삭제</button></td>';
      tr.querySelector('.delBtn').addEventListener('click', function () {
        tr.remove();
        updateRowCountInfo();
      });
      rowsBody.appendChild(tr);
      updateRowCountInfo();
    }

    function updateRowCountInfo() {
      const rows = rowsBody.querySelectorAll('tr').length;
      rowCountInfo.textContent = rows + ' / ' + maxRows + '행';
      addRowBtn.disabled = rows >= maxRows;
    }

    addRowBtn.addEventListener('click', addRow);

    google.script.run
      .withSuccessHandler(function (init) {
        document.getElementById('sheetName').textContent = init.sheetName;
        maxRows = init.maxRows || 30;

        const roomList = document.getElementById('roomList');
        init.roomNames.forEach(function (name) {
          const opt = document.createElement('option');
          opt.value = name;
          roomList.appendChild(opt);
        });

        for (let i = 0; i < DEFAULT_ROWS; i++) addRow();
      })
      .withFailureHandler(function (err) {
        statusEl.textContent = '오류: ' + err.message;
      })
      .ATT_getDialogInit();

    function downloadBase64Zip(base64, fileName) {
      const byteChars = atob(base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/zip' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    runBtn.addEventListener('click', function () {
      const configs = [];
      rowsBody.querySelectorAll('tr').forEach(function (tr) {
        configs.push({
          className: tr.querySelector('.cls').value,
          courseName: tr.querySelector('.course').value,
          entryCode: tr.querySelector('.code').value,
          linkName: tr.querySelector('.link').value,
        });
      });

      runBtn.disabled = true;
      statusEl.textContent = '생성 중...';

      google.script.run
        .withSuccessHandler(function (result) {
          downloadBase64Zip(result.zipBase64, result.zipFileName);

          const lines = result.files.map(function (f) {
            return '- ' + f.className + ': ' + f.count + '명';
          });

          let html = '✔ 다운로드 시작됨: ' + result.zipFileName + '<br>' + lines.join('<br>');

          if (result.excluded && result.excluded.length > 0) {
            const exLines = result.excluded.map(function (e) {
              return '- ' + e.name + ' (' + e.phone + ') — ' + e.room;
            });
            html += '<br><br><span style="color:#C62828;">⚠ 번호 형식이 맞지 않아 제외됨 (' +
              result.excluded.length + '명):</span><br>' + exLines.join('<br>');
          }

          statusEl.innerHTML = html;
          runBtn.disabled = false;
        })
        .withFailureHandler(function (err) {
          statusEl.textContent = '오류: ' + err.message;
          runBtn.disabled = false;
        })
        .ATT_generate(configs);
    });
  </script>
</body>
</html>
