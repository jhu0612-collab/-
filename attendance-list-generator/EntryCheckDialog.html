<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "맑은 고딕", "Malgun Gothic", sans-serif;
      padding: 18px;
      font-size: 13px;
      background: #F8FAFC;
      color: #1E293B;
    }

    #metaCard {
      background: #EEF2FF;
      border: 1px solid #C7D2FE;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    #metaCard .label { font-size: 12px; color: #4338CA; font-weight: 600; }
    #sheetNameRow {
      display: flex; align-items: center; gap: 8px;
      font-size: 19px; font-weight: 800; color: #312E81; margin-top: 2px;
    }
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 3px solid #C7D2FE;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: ecd-spin 0.7s linear infinite;
    }
    #sheetNameRow.loading .spinner { display: inline-block; }
    #sheetNameRow.loading #sheetName { color: #6366F1; font-weight: 600; font-size: 14px; }
    @keyframes ecd-spin { to { transform: rotate(360deg); } }

    .sectionLabel { font-size: 12px; color: #64748B; font-weight: 600; margin-bottom: 6px; }

    #dropZone {
      border: 2px dashed #C7D2FE;
      border-radius: 10px;
      background: #fff;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 10px;
    }
    #dropZone:hover { border-color: #4F46E5; background: #EEF2FF; }
    #dropZone.hasFile { border-style: solid; border-color: #4F46E5; background: #EEF2FF; }
    #dropZone .icon { font-size: 26px; margin-bottom: 6px; }
    #dropZone .hint { color: #94A3B8; font-size: 11.5px; margin-top: 4px; }
    #fileInput { display: none; }
    #fileNameLabel { font-weight: 700; color: #312E81; }

    #runBtn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #4F46E5, #4338CA);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(79,70,229,0.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      margin-top: 4px;
    }
    #runBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(79,70,229,0.4); }
    #runBtn:disabled { cursor: default; opacity: 0.5; box-shadow: none; }

    #applyBtn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #16A34A, #15803D);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(22,163,74,0.3);
      margin: 10px 0 14px;
      display: none;
    }
    #applyBtn:hover:not(:disabled) { transform: translateY(-1px); }
    #applyBtn:disabled { cursor: default; opacity: 0.5; box-shadow: none; }
    #applyBtn.done { background: #94A3B8; box-shadow: none; }

    #progressWrap { display: none; margin-top: 12px; }
    #progressTrack { width: 100%; height: 8px; background: #E2E8F0; border-radius: 999px; overflow: hidden; }
    #progressBar {
      width: 40%; height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #818CF8, #4F46E5, #818CF8);
      background-size: 200% 100%;
      animation: ecd-slide 1.1s ease-in-out infinite, ecd-shimmer 1.4s linear infinite;
    }
    @keyframes ecd-slide { 0% { margin-left: -40%; } 50% { margin-left: 70%; } 100% { margin-left: -40%; } }
    @keyframes ecd-shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
    #progressLabel { font-size: 12px; color: #64748B; margin-top: 6px; }

    #resultArea { display: none; margin-top: 8px; }

    .cardGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .statCard {
      background: #fff; border: 1px solid #E2E8F0; border-radius: 10px;
      padding: 12px 14px; cursor: pointer; transition: all 0.15s ease;
    }
    .statCard:hover { border-color: #A5B4FC; box-shadow: 0 2px 8px rgba(79,70,229,0.12); }
    .statCard.open { border-color: #4F46E5; background: #EEF2FF; }
    .statCard .cardLabel { font-size: 12px; color: #64748B; font-weight: 600; }
    .statCard .cardValue { font-size: 24px; font-weight: 800; margin-top: 2px; }
    .statCard.enter .cardValue { color: #15803D; }
    .statCard.outside .cardValue { color: #B45309; }
    .statCard.left .cardValue { color: #DC2626; }
    .statCard.notin .cardValue { color: #475569; }

    .revealRow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 12.5px; color: #475569; }

    .panelWrap { display: none; margin-bottom: 10px; }
    .panelHeader {
      display: flex; align-items: center; justify-content: space-between;
      background: #F1F5F9; border: 1px solid #E2E8F0; border-bottom: none;
      border-radius: 10px 10px 0 0; padding: 6px 10px;
    }
    .panelHeader .panelTitle { font-size: 11.5px; font-weight: 700; color: #475569; }
    .copyBtn {
      border: 1px solid #CBD5E1; background: #fff; color: #475569;
      font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
    }
    .copyBtn:hover { background: #E2E8F0; }
    .copyBtn.copied { background: #DCFCE7; border-color: #86EFAC; color: #15803D; }
    .listPanel {
      background: #fff; border: 1px solid #E2E8F0; border-radius: 0 0 10px 10px;
      padding: 8px 12px; max-height: 150px; overflow-y: auto;
      font-size: 14px; font-family: Arial, sans-serif; line-height: 1.7;
    }
    .listPanel .empty { color: #94A3B8; }

    #logSummary {
      background: #F1F5F9; border-radius: 10px; padding: 10px 12px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px;
      font-size: 12.5px;
    }
    #logSummary .k { color: #64748B; }
    #logSummary .v { font-weight: 700; color: #1E293B; margin-left: 4px; }

    #errorBox { color: #DC2626; margin-top: 10px; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="metaCard">
    <div class="label">대상 탭</div>
    <div id="sheetNameRow" class="loading">
      <span class="spinner"></span>
      <span id="sheetName">시트 인식 중...</span>
    </div>
  </div>

  <div class="sectionLabel">카카오톡 대화 내보내기 파일(.txt)</div>
  <div id="dropZone">
    <div class="icon">📄</div>
    <div id="fileNameLabel">클릭해서 .txt 파일 선택</div>
    <div class="hint">카카오톡 "대화 내보내기"로 저장한 원본 파일을 그대로 올리면 됩니다</div>
  </div>
  <input type="file" id="fileInput" accept=".txt">

  <button id="runBtn" disabled>▶ 입장자체크 (분석만, 시트 변경 없음)</button>

  <div id="progressWrap">
    <div id="progressTrack"><div id="progressBar"></div></div>
    <div id="progressLabel">대조 중...</div>
  </div>

  <div id="errorBox"></div>

  <div id="resultArea">
    <div class="cardGrid">
      <div class="statCard enter" data-target="wrap-entered">
        <div class="cardLabel">입장자</div>
        <div class="cardValue" id="count-entered">0</div>
      </div>
      <div class="statCard outside" data-target="wrap-outside">
        <div class="cardLabel">명단 외 입장자</div>
        <div class="cardValue" id="count-outside">0</div>
      </div>
      <div class="statCard left" data-target="wrap-left">
        <div class="cardLabel">퇴장자 (최종)</div>
        <div class="cardValue" id="count-left">0</div>
      </div>
      <div class="statCard notin" data-target="wrap-notin">
        <div class="cardLabel">미입장자</div>
        <div class="cardValue" id="count-notin">0</div>
      </div>
    </div>

    <label class="revealRow">
      <input type="checkbox" id="revealFull"> 번호 전체보기 (이름 + 전화번호 전체 표시)
    </label>

    <div class="panelWrap" id="wrap-entered">
      <div class="panelHeader"><span class="panelTitle">입장자 목록</span><button type="button" class="copyBtn" data-panel="panel-entered">📋 복사</button></div>
      <div id="panel-entered" class="listPanel"></div>
    </div>
    <div class="panelWrap" id="wrap-outside">
      <div class="panelHeader"><span class="panelTitle">명단 외 입장자 목록</span><button type="button" class="copyBtn" data-panel="panel-outside">📋 복사</button></div>
      <div id="panel-outside" class="listPanel"></div>
    </div>
    <div class="panelWrap" id="wrap-left">
      <div class="panelHeader"><span class="panelTitle">퇴장자(최종) 목록</span><button type="button" class="copyBtn" data-panel="panel-left">📋 복사</button></div>
      <div id="panel-left" class="listPanel"></div>
    </div>
    <div class="panelWrap" id="wrap-notin">
      <div class="panelHeader"><span class="panelTitle">미입장자 목록</span><button type="button" class="copyBtn" data-panel="panel-notin">📋 복사</button></div>
      <div id="panel-notin" class="listPanel"></div>
    </div>

    <button id="applyBtn">✅ 반영하기</button>

    <div class="sectionLabel" style="margin-top:6px;">로그 요약</div>
    <div id="logSummary">
      <div><span class="k">입장 로그 수</span><span class="v" id="sum-enterLog">0</span></div>
      <div><span class="k">퇴장 로그 수</span><span class="v" id="sum-leaveLog">0</span></div>
      <div><span class="k">명단 입장자</span><span class="v" id="sum-entered">0</span></div>
      <div><span class="k">명단 퇴장자</span><span class="v" id="sum-left">0</span></div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameLabel = document.getElementById('fileNameLabel');
    const runBtn = document.getElementById('runBtn');
    const applyBtn = document.getElementById('applyBtn');
    const errorBox = document.getElementById('errorBox');
    const progressWrap = document.getElementById('progressWrap');
    const resultArea = document.getElementById('resultArea');
    const revealFull = document.getElementById('revealFull');

    let fileText = null;
    let lastResult = null;

    dropZone.addEventListener('click', function () { fileInput.click(); });

    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        fileText = evt.target.result;
        dropZone.classList.add('hasFile');
        fileNameLabel.textContent = '✔ ' + file.name;
        runBtn.disabled = false;
      };
      reader.readAsText(file, 'UTF-8');
    });

    google.script.run
      .withSuccessHandler(function (sheetName) {
        document.getElementById('sheetNameRow').classList.remove('loading');
        document.getElementById('sheetName').textContent = sheetName;
      })
      .withFailureHandler(function (err) {
        document.getElementById('sheetNameRow').classList.remove('loading');
        document.getElementById('sheetName').textContent = '인식 실패';
      })
      .ATT_getActiveSheetName();

    function formatPerson(p) {
      return revealFull.checked ? ('- ' + p.name + ' / ' + p.fullPhone) : ('- ' + p.name + ' / ' + p.last4);
    }

    function renderPanel(panelId, items, mode) {
      const el = document.getElementById(panelId);
      if (!items || items.length === 0) {
        el.innerHTML = '<span class="empty">없음</span>';
        return;
      }
      el.innerHTML = items.map(function (it) {
        if (mode === 'outside') {
          return '- ' + it.raw + ' <span style="color:#94A3B8;">— ' + it.reason + '</span>';
        }
        return formatPerson(it);
      }).join('<br>');
    }

    function renderAllPanels() {
      if (!lastResult) return;
      renderPanel('panel-entered', lastResult.entered, 'person');
      renderPanel('panel-outside', lastResult.outsideEntrants, 'outside');
      renderPanel('panel-left', lastResult.left, 'person');
      renderPanel('panel-notin', lastResult.notAppeared, 'person');
    }

    revealFull.addEventListener('change', renderAllPanels);

    document.querySelectorAll('.statCard').forEach(function (card) {
      card.addEventListener('click', function () {
        const panel = document.getElementById(card.dataset.target);
        const isOpen = panel.style.display === 'block';
        document.querySelectorAll('.panelWrap').forEach(function (p) { p.style.display = 'none'; });
        document.querySelectorAll('.statCard').forEach(function (c) { c.classList.remove('open'); });
        if (!isOpen) {
          panel.style.display = 'block';
          card.classList.add('open');
        }
      });
    });

    document.querySelectorAll('.copyBtn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const panelId = btn.dataset.panel;
        const el = document.getElementById(panelId);
        const text = el.innerText || el.textContent;

        function done() {
          btn.textContent = '✔ 복사됨';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = '📋 복사';
            btn.classList.remove('copied');
          }, 1500);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {
            fallbackCopy(text);
            done();
          });
        } else {
          fallbackCopy(text);
          done();
        }
      });
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    runBtn.addEventListener('click', function () {
      if (!fileText) return;
      runBtn.disabled = true;
      errorBox.textContent = '';
      resultArea.style.display = 'none';
      applyBtn.style.display = 'none';
      applyBtn.classList.remove('done');
      applyBtn.disabled = false;
      applyBtn.textContent = '✅ 반영하기';
      progressWrap.style.display = 'block';

      google.script.run
        .withSuccessHandler(function (result) {
          progressWrap.style.display = 'none';
          runBtn.disabled = false;

          lastResult = result;

          document.getElementById('count-entered').textContent = result.entered.length;
          document.getElementById('count-outside').textContent = result.outsideEntrants.length;
          document.getElementById('count-left').textContent = result.left.length;
          document.getElementById('count-notin').textContent = result.notAppeared.length;

          document.getElementById('sum-enterLog').textContent = result.enterLogCount;
          document.getElementById('sum-leaveLog').textContent = result.leaveLogCount;
          document.getElementById('sum-entered').textContent = result.entered.length;
          document.getElementById('sum-left').textContent = result.left.length;

          renderAllPanels();
          resultArea.style.display = 'block';
          applyBtn.style.display = result.entered.length > 0 ? 'block' : 'none';

          setTimeout(function () {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          }, 50);
        })
        .withFailureHandler(function (err) {
          progressWrap.style.display = 'none';
          runBtn.disabled = false;
          errorBox.textContent = '오류: ' + err.message;
        })
        .ATT_checkEntrants(fileText);
    });

    applyBtn.addEventListener('click', function () {
      if (!lastResult || lastResult.entered.length === 0) return;
      applyBtn.disabled = true;
      applyBtn.textContent = '반영 중...';

      const rowNumbers = lastResult.entered.map(function (p) { return p.sheetRow; });

      google.script.run
        .withSuccessHandler(function (res) {
          applyBtn.textContent = '✔ ' + res.appliedCount + '명 반영 완료';
          applyBtn.classList.add('done');
        })
        .withFailureHandler(function (err) {
          applyBtn.disabled = false;
          applyBtn.textContent = '✅ 반영하기';
          errorBox.textContent = '오류: ' + err.message;
        })
        .ATT_applyEntryChecks(rowNumbers);
    });
  </script>
</body>
</html>
